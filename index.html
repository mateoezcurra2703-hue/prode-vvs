<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prode VVS · Mundial 2026</title>
<style>
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --card: #ffffff;
  --accent: #b8880c;
  --accent-dim: rgba(184,136,12,.1);
  --blue: #2563eb;
  --text: #111111;
  --muted: #71717a;
  --muted2: #a1a1aa;
  --success: #16a34a;
  --danger: #dc2626;
  --border: #e4e4e7;
  --border2: #d4d4d8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; -webkit-font-smoothing: antialiased;
}

/* ── HEADER ── */
.header {
  background: #fff;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between;
  height: 60px; position: sticky; top: 0; z-index: 200;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
}
.header-brand { display: flex; align-items: center; gap: 10px; color: var(--text); }
.vvs-wordmark { font-size: 1.25rem; font-weight: 800; letter-spacing: 2px; color: #111; }
.header-divider { width: 1px; height: 22px; background: var(--border2); margin: 0 4px; }
.header-prode { font-size: 0.72rem; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500; }
.header-user { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: var(--muted); }
.header-user b { color: var(--text); font-weight: 700; }

/* ── NAV ── */
.nav {
  background: #fff;
  border-bottom: 1px solid var(--border);
  display: flex; overflow-x: auto; padding: 0 20px;
  scrollbar-width: none;
}
.nav::-webkit-scrollbar { display: none; }
.nav-tab {
  padding: 14px 18px; cursor: pointer; color: var(--muted);
  font-size: 0.82rem; white-space: nowrap; font-weight: 500;
  border-bottom: 2px solid transparent; transition: all .2s; letter-spacing: .2px;
}
.nav-tab:hover { color: var(--text); }
.nav-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }

/* ── LAYOUT ── */
.main { padding: 24px 20px 90px; max-width: 1100px; margin: 0 auto; }

/* ── CARDS ── */
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px; margin-bottom: 14px;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.card-title { font-size: 0.78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
.card-title.gold { color: var(--accent); }

/* ── BUTTONS ── */
.btn {
  background: #111; color: #fff; border: none;
  border-radius: 7px; padding: 9px 20px; font-size: 0.85rem;
  font-weight: 700; cursor: pointer; letter-spacing: .3px;
  transition: opacity .2s, transform .1s; display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { opacity: .8; transform: translateY(-1px); }
.btn-outline {
  background: transparent; color: var(--text); border: 1px solid var(--border2);
}
.btn-outline:hover { background: var(--bg); opacity: 1; }
.btn-sm { padding: 6px 14px; font-size: 0.78rem; }

/* ── INPUTS ── */
input[type="text"], input[type="number"], input[type="password"] {
  background: #fafafa; border: 1px solid var(--border2);
  border-radius: 7px; color: var(--text); padding: 9px 12px;
  font-size: 0.88rem; transition: border-color .2s;
}
input:focus { outline: none; border-color: #111; background: #fff; }
input[type="number"] { width: 50px; text-align: center; padding: 8px 4px; -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
input:disabled { opacity: .4; cursor: not-allowed; background: #f0f0f0; }

/* ── LOGIN ── */
.login-wrap { min-height: calc(100vh - 60px); display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); }
.login-card {
  background: #fff; border: 1px solid var(--border);
  border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 400px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,.08);
}
.login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 6px; }
.login-logo .vvs-wordmark { font-size: 1.6rem; }
.login-sub { font-size: 0.7rem; color: var(--muted2); letter-spacing: 2.5px; text-transform: uppercase; margin-bottom: 28px; }
.login-divider { margin: 20px 0; border: none; border-top: 1px solid var(--border); }
.login-chip-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 10px; }
.login-chip {
  background: var(--bg); border: 1px solid var(--border2);
  border-radius: 99px; padding: 6px 14px; cursor: pointer;
  font-size: 0.82rem; color: var(--muted); transition: all .2s;
}
.login-chip:hover { border-color: #111; color: #111; }

/* ── SECTION HEADER ── */
.sec-hd { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
.sec-title { font-size: 1.1rem; font-weight: 700; }
.sec-sub { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }

/* ── PROGRESS ── */
.prog-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .4s; }

/* ── SUB TABS ── */
.sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.sub-tab {
  padding: 5px 13px; border-radius: 6px; background: #fff;
  border: 1px solid var(--border2); cursor: pointer; font-size: 0.76rem;
  color: var(--muted); transition: all .2s; font-weight: 500;
}
.sub-tab:hover { color: var(--text); border-color: #aaa; }
.sub-tab.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); font-weight: 700; }

/* ── MATCH ROW ── */
.match-row {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.match-row:last-child { border-bottom: none; }
.team { flex: 1; font-size: 0.84rem; display: flex; align-items: center; gap: 5px; }
.team.right { justify-content: flex-end; }
.score-box { display: flex; align-items: center; gap: 6px; }
.score-sep { color: var(--muted2); font-weight: 700; font-size: 0.9rem; }
.result-tag { font-size: 0.72rem; min-width: 52px; text-align: center; }
.exact-tag { color: var(--success); font-weight: 700; }
.correct-tag { color: var(--accent); font-weight: 700; }
.wrong-tag { color: var(--muted2); }
.result-score { font-size: 0.78rem; font-weight: 700; color: var(--accent); background: var(--accent-dim); padding: 2px 8px; border-radius: 4px; }

/* ── GROUPS ── */
.groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 12px; }
.group-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.group-table td { padding: 7px 4px; border-bottom: 1px solid var(--border); }
.group-table tr:last-child td { border-bottom: none; }
.group-table .pts { font-weight: 700; color: var(--accent); text-align: center; }
.group-table .pj { color: var(--muted); text-align: center; }
.group-results { margin-top: 10px; font-size: 0.74rem; color: var(--muted); }
.group-results div { padding: 2px 0; }

/* ── LEADERBOARD ── */
.lb-table { width: 100%; border-collapse: collapse; }
.lb-table th { text-align: left; padding: 8px 12px; font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; border-bottom: 1px solid var(--border); }
.lb-table td { padding: 12px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
.lb-table tr:last-child td { border-bottom: none; }
.lb-table tr.me { background: var(--accent-dim); }
.rank { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 800; }
.r1{background:#FFD700;color:#000} .r2{background:#C0C0C0;color:#000} .r3{background:#CD7F32;color:#fff} .rn{background:var(--bg);color:var(--muted);border:1px solid var(--border)}
.pts-chip { background: var(--blue); color: #fff; padding: 2px 10px; border-radius: 99px; font-size: 0.78rem; font-weight: 700; }

/* ── BRACKET ── */
.bracket-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
.bm { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
.round-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

/* ── SAVE BAR ── */
.save-bar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
  border-top: 1px solid var(--border);
  padding: 12px 20px; display: flex; align-items: center; gap: 12px; z-index: 100;
  box-shadow: 0 -2px 8px rgba(0,0,0,.06);
}
.save-ok { font-size: 0.82rem; color: var(--success); font-weight: 600; }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 72px; left: 50%; transform: translateX(-50%);
  background: #111; color: #fff; padding: 8px 20px;
  border-radius: 99px; font-size: 0.82rem; font-weight: 600;
  z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,.2);
  opacity: 0; transition: opacity .35s; pointer-events: none; white-space: nowrap;
}

/* ── NOTICES ── */
.warn-box { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: #92400e; margin-bottom: 16px; }
.info-box { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px 14px; font-size: 0.82rem; color: #166534; margin-bottom: 16px; }

/* ── SCORING LEGEND ── */
.score-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.legend-label { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 8px; font-weight: 700; }
.legend-row { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid var(--border); font-size: 0.83rem; }
.legend-row:last-child { border-bottom: none; }

/* ── FOOTER ── */
.footer { text-align: center; padding: 20px; font-size: 0.72rem; color: var(--muted2); letter-spacing: .5px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: center; gap: 8px; }

.hint { font-size: 0.74rem; color: var(--muted); margin-top: 5px; }
.badge-me { background: var(--blue); color: #fff; padding: 1px 7px; border-radius: 3px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }

@media (max-width: 600px) {
  .main { padding: 14px 12px 90px; }
  .login-card { padding: 28px 20px; }
  .header { padding: 0 14px; }
  .score-legend { grid-template-columns: 1fr; }
  .header-divider, .header-prode { display: none; }
}

/* ── COUNTDOWN ── */
.cd-card {
  background: linear-gradient(135deg,#0a1628 0%,#1a2f50 100%);
  border: none; border-radius: 12px; padding: 22px 20px;
  margin-bottom: 18px; text-align: center; color: #fff;
}
.cd-title { font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase; color: #7ea8d4; margin-bottom: 14px; font-weight: 600; }
.cd-grid { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
.cd-block { display: flex; flex-direction: column; align-items: center; min-width: 56px; }
.cd-num {
  font-size: 2.2rem; font-weight: 900; line-height: 1;
  background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px; padding: 8px 12px; min-width: 60px; text-align: center;
  font-variant-numeric: tabular-nums; letter-spacing: -1px;
}
.cd-label { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: #7ea8d4; margin-top: 6px; }
.cd-sep { font-size: 2rem; font-weight: 900; line-height: 1; padding-top: 8px; color: rgba(255,255,255,.3); align-self: flex-start; margin-top: 8px; }
.cd-done { font-size: 1.3rem; font-weight: 800; color: #fbbf24; }

/* ── TICKER ── */
@keyframes go-left {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@keyframes go-right {
  0%   { transform: translateX(-50%); }
  100% { transform: translateX(0); }
}
.ticker-wrap { position: fixed; bottom: 0; left: 0; right: 0; z-index: 150; overflow: hidden; }
.ticker-row { overflow: hidden; }
.ticker-track { display: flex; white-space: nowrap; }
.ticker-track span { display: inline-block; padding: 0 2em; }
.ticker-navy { background: #0a1628; }
.ticker-navy .ticker-track { animation: go-left 22s linear infinite; }
.ticker-navy .ticker-track span { font-size: 0.72rem; font-weight: 700; letter-spacing: 2.5px; color: #f4c430; padding: 7px 2em; text-transform: uppercase; }
.ticker-red { background: #dc2626; }
.ticker-red .ticker-track { animation: go-right 18s linear infinite; }
.ticker-red .ticker-track span { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; color: #ffffff; padding: 6px 2em; text-transform: uppercase; }

/* ── PIN ── */
.pin-row { display: flex; gap: 10px; justify-content: center; margin: 14px 0; }
.pin-dot {
  width: 44px; height: 54px; border: 2px solid var(--border2);
  border-radius: 10px; font-size: 1.5rem; font-weight: 900;
  text-align: center; background: #fafafa; color: var(--text);
  transition: border-color .2s;
}
.pin-dot:focus { border-color: #111; background: #fff; outline: none; }
.pin-hint { font-size: 0.74rem; color: var(--muted); text-align: center; margin-bottom: 4px; }
.pin-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
.pin-name { font-size: 0.82rem; color: var(--accent); font-weight: 700; margin-bottom: 16px; }
</style>
</head>

// ── SCORING ─────────────────────────────────────────────────────────────────

function res(h,a){if(h==null||a==null||h===''||a==='')return null;return+h>+a?'H':+a>+h?'A':'D';}

function scoreUser(u){
  const picks=getPicks(u),r=G.results;
  let total=0,exact=0,correct=0,wrong=0;
  for(const[mid,rv]of Object.entries(r)){
    if(mid==='bonus')continue;
    if(!hasResult(rv))continue;
    const p=picks[mid];if(!p||p.h===''||p.h==null)continue;
    const isG=mid.startsWith('G');
    const rv_=res(rv.h,rv.a),pv_=res(p.h,p.a);
    if(+p.h===+rv.h&&+p.a===+rv.a){total+=isG?3:4;exact++;}
    else if(pv_===rv_){total+=isG?1:2;correct++;}
    else wrong++;
  }
  const b=getBonus(u),br=r.bonus||{};
  if(b.champion&&br.champion&&b.champion===br.champion)total+=10;
  if(b.topScorer&&br.topScorer&&b.topScorer===br.topScorer)total+=5;
  return{total,exact,correct,wrong};
}

function pickSt(mid,pick,results){
  if(!hasResult(results[mid]))return null;
  if(!pick||pick.h===''||pick.h==null)return'empty';
  const rv=results[mid];
  if(+pick.h===+rv.h&&+pick.a===+rv.a)return'exact';
  if(res(pick.h,pick.a)===res(rv.h,rv.a))return'correct';
  return'wrong';
}

          <td class="pts">${st.pts}</td>
        </tr>`;}).join('')}</tbody>
      </table>
      <div class="group-results">${GROUP_MATCHES.filter(m=>m.group===gk).map(m=>{
        const r=G.results[m.id];if(!hasResult(r))return'';
        return`<div>${f(m.home)} ${m.home} <b style="color:var(--text)">${r.h}-${r.a}</b> ${m.away} ${f(m.away)}</div>`;
      }).join('')}</div>
    </div>`).join('')}
  </div>`;
}

function teamStats(gk,team){
  let pj=0,pts=0;
  GROUP_MATCHES.filter(m=>m.group===gk&&(m.home===team||m.away===team)).forEach(m=>{
    const r=G.results[m.id];if(!hasResult(r))return;pj++;
    const mine=m.home===team?+r.h:+r.a,opp=m.home===team?+r.a:+r.h;
    if(mine>opp)pts+=3;else if(mine===opp)pts+=1;
  });
  return{pj,pts};
}

// ── HANDLERS ─────────────────────────────────────────────────────────────────
function bindInputs(){
  document.querySelectorAll('input[data-mid]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const mid=inp.dataset.mid,s=inp.dataset.s;
      if(!PICKS[mid])PICKS[mid]={h:'',a:''};
      PICKS[mid][s]=inp.value===''?'':+inp.value;
      scheduleAutoSave();
    });
  });
  document.querySelectorAll('input[data-res]').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const mid=inp.dataset.res,s=inp.dataset.s;
      if(!G.results[mid])G.results[mid]={h:'',a:''};
      G.results[mid][s]=inp.value===''?'':+inp.value;
    });
  });
  document.querySelectorAll('input[data-kt]').forEach(inp=>{
    inp.addEventListener('input',()=>{ G.kt[inp.dataset.kt]=inp.value; });
  });
}

function scheduleAutoSave(){
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>{
    setPicks(CU,PICKS);
    const sk=document.getElementById('SK');
    if(sk){sk.textContent='✓ Guardado';setTimeout(()=>{sk.textContent='';},2000);}
  },800);
}

function setTab(t){TAB=t;GF='A';render();}
function switchGF(g){GF=g;const mc=document.getElementById('MC');if(mc){mc.innerHTML=rTab();bindInputs();}}
function doSave(){clearTimeout(autoSaveTimer);setPicks(CU,PICKS);const sk=document.getElementById('SK');if(sk){sk.textContent='✓ Guardado';setTimeout(()=>{sk.textContent='';},2000);}}

function toast(msg){
  const t=document.getElementById('toast');

function rCountdown(){
  const target = new Date('2026-06-11T19:00:00Z');
  const now = new Date();
  const diff = target - now;
  if(diff <= 0) return `<div class="cd-card"><div class="cd-title">⚽ Copa del Mundo</div><div class="cd-done">¡El Mundial ya comenzó!</div></div>`;
  const days  = Math.floor(diff/86400000);
  const hours = Math.floor((diff%86400000)/3600000);
  const mins  = Math.floor((diff%3600000)/60000);
  const secs  = Math.floor((diff%60000)/1000);
  const p = n => String(n).padStart(2,'0');
  return `<div class="cd-card">
    <div class="cd-title">⚽ Cuenta Regresiva — Copa del Mundo 2026</div>
    <div class="cd-grid">
      <div class="cd-block"><div class="cd-num" id="cd-d">${p(days)}</div><div class="cd-label">días</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-h">${p(hours)}</div><div class="cd-label">horas</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-m">${p(mins)}</div><div class="cd-label">min</div></div>
      <div class="cd-sep">:</div>
      <div class="cd-block"><div class="cd-num" id="cd-s">${p(secs)}</div><div class="cd-label">seg</div></div>
    </div>
  </div>`;
}

let cdInterval = null;
function startCountdown(){
  if(cdInterval) clearInterval(cdInterval);
  cdInterval = setInterval(()=>{
    const target = new Date('2026-06-11T19:00:00Z');
    const diff = target - new Date();
    if(diff <= 0){ clearInterval(cdInterval); return; }
    const days  = Math.floor(diff/86400000);
    const hours = Math.floor((diff%86400000)/3600000);
    const mins  = Math.floor((diff%3600000)/60000);
    const secs  = Math.floor((diff%60000)/1000);
    const p = n => String(n).padStart(2,'0');
    const d=document.getElementById('cd-d'), h=document.getElementById('cd-h'),
          m=document.getElementById('cd-m'), s=document.getElementById('cd-s');
    if(d) d.textContent=p(days);
    if(h) h.textContent=p(hours);
    if(m) m.textContent=p(mins);
    if(s) s.textContent=p(secs);
  }, 1000);
}
